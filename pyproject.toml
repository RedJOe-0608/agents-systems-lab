[project]
name = "agents-systems-lab"
version = "0.1.0"
description = "A framework-first laboratory for multi-agent systems, CodeAct, and recursive context processing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "RedJOe-0608" }]
dependencies = [
    "deepagents",
    "langchain",
    "langgraph",
    "langsmith",
    "pydantic>=2",
    "pydantic-settings",
    "rich",
    "typer",
]

[project.scripts]
agents-lab = "agent_systems_lab.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_systems_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_systems_lab"]

